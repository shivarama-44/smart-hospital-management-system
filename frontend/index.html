 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital Management System - Dynamic Full Stack App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // DOCTORS DATABASE WITH SPECIALTIES
            const [doctors] = React.useState([
                { id: 1, name: "Dr. A. Sharma", dept: "Cardiology", status: "Available", timing: "09:00 AM - 02:00 PM", fee: "₹500" },
                { id: 2, name: "Dr. Bunny", dept: "Orthopedics", status: "In OPD", timing: "10:00 AM - 04:00 PM", fee: "₹600" },
                { id: 3, name: "Dr. C. Verma", dept: "Neurology", status: "On Duty", timing: "11:00 AM - 05:00 PM", fee: "₹700" },
                { id: 4, name: "Dr. D. Gupta", dept: "General Medicine", status: "Available", timing: "08:00 AM - 01:00 PM", fee: "₹400" },
                { id: 5, name: "Dr. Kale Kadha", dept: "Kale Kadha", status: "Available", timing: "10:00 AM - 03:00 PM", fee: "₹500" }
            ]);

            // STARTS COMPLETELY EMPTY
            const [patients, setPatients] = React.useState([]);
            const [appointments, setAppointments] = React.useState([]);

            // Form State
            const [formData, setFormData] = React.useState({
                name: '', age: '', gender: 'Male', disease: 'Kale Kadha', doctor: 'Dr. Kale Kadha', phone: ''
            });

            const handleDiseaseChange = (e) => {
                const selectedDisease = e.target.value;
                const matchedDoc = doctors.find(d => d.dept === selectedDisease);
                setFormData({
                    ...formData,
                    disease: selectedDisease,
                    doctor: matchedDoc ? matchedDoc.name : doctors[0].name
                });
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleAddPatient = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.age || !formData.phone) return;

                const newPatientId = patients.length + 101;
                const newBookingId = appointments.length + 501;
                const currentTimeSlot = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const newPatient = {
                    id: newPatientId,
                    ...formData,
                    status: "Admitted"
                };

                const newAppointment = {
                    id: newBookingId,
                    patient: formData.name,
                    doctor: formData.doctor,
                    disease: formData.disease,
                    date: new Date().toISOString().split('T')[0],
                    time: currentTimeSlot,
                    status: "Confirmed"
                };

                setPatients([...patients, newPatient]);
                setAppointments([...appointments, newAppointment]);

                setFormData({
                    name: '', age: '', gender: 'Male', disease: 'Kale Kadha', doctor: 'Dr. Kale Kadha', phone: ''
                });
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-slate-900 text-white shadow-lg border-b border-slate-700">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2.5 rounded-xl text-white font-bold text-xl">
                                    <i className="fa-solid fa-hospital-user"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-wide">Smart Hospital System</h1>
                                    <p className="text-xs text-slate-400">Full Stack Project • Spring Boot & React Engine</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    REST API Connected
                                </span>
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 flex space-x-1 overflow-x-auto">
                            {[
                                { id: 'dashboard', label: 'Dashboard Overview', icon: 'fa-chart-pie' },
                                { id: 'patients', label: 'Patient Module', icon: 'fa-user-injured' },
                                { id: 'doctors', label: 'Doctor Module', icon: 'fa-user-md' },
                                { id: 'appointments', label: 'Appointment Module', icon: 'fa-calendar-check' },
                                { id: 'departments', label: 'Department Module', icon: 'fa-building-columns' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-5 py-3.5 text-sm font-medium border-b-2 whitespace-nowrap transition-all ${
                                        activeTab === tab.id
                                            ? 'border-indigo-600 text-indigo-600 bg-indigo-50/50'
                                            : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'
                                    }`}
                                >
                                    <i className={`fa-solid ${tab.icon}`}></i>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-6">
                        
                        {/* TAB 1: OVERVIEW DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase font-semibold text-slate-400">Total Patients</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{patients.length}</p>
                                        </div>
                                        <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-users"></i>
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase font-semibold text-slate-400">Active Doctors</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{doctors.length}</p>
                                        </div>
                                        <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-user-md"></i>
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase font-semibold text-slate-400">Appointments Fixed</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">{appointments.length}</p>
                                        </div>
                                        <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-calendar-day"></i>
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase font-semibold text-slate-400">Active Departments</p>
                                            <p className="text-2xl font-bold text-slate-800 mt-1">5 Active</p>
                                        </div>
                                        <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-hospital-bay"></i>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h3 className="font-semibold text-slate-800 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-list-check text-indigo-600"></i> Live Patient & Appointment Stream
                                    </h3>
                                    {patients.length === 0 ? (
                                        <div className="text-center py-10 text-slate-400">
                                            <i className="fa-solid fa-folder-open text-4xl mb-2"></i>
                                            <p>No appointments fixed yet. Add a patient from the "Patient Module" tab!</p>
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-sm">
                                                <thead>
                                                    <tr className="bg-slate-50 text-slate-500 uppercase text-xs">
                                                        <th className="p-3">ID</th>
                                                        <th className="p-3">Patient</th>
                                                        <th className="p-3">Department</th>
                                                        <th className="p-3">Specialist Doctor</th>
                                                        <th className="p-3">Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {patients.map(p => (
                                                        <tr key={p.id}>
                                                            <td className="p-3 font-semibold">#{p.id}</td>
                                                            <td className="p-3 text-slate-800 font-medium">{p.name}</td>
                                                            <td className="p-3 text-slate-600">{p.disease}</td>
                                                            <td className="p-3 text-slate-600 font-bold text-indigo-600">{p.doctor}</td>
                                                            <td className="p-3">
                                                                <span className="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">
                                                                    {p.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: PATIENT MODULE */}
                        {activeTab === 'patients' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h3 className="font-semibold text-slate-800 mb-4 pb-2 border-b">Register Patient & Fix Appointment</h3>
                                    <form onSubmit={handleAddPatient} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Patient Name</label>
                                            <input type="text" name="name" required value={formData.name} onChange={handleInputChange} className="w-full border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="e.g. Ramesh Kumar" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Age</label>
                                                <input type="number" name="age" required value={formData.age} onChange={handleInputChange} className="w-full border p-2.5 rounded-lg outline-none text-sm" placeholder="42" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Gender</label>
                                                <select name="gender" value={formData.gender} onChange={handleInputChange} className="w-full border p-2.5 rounded-lg outline-none text-sm">
                                                    <option>Male</option>
                                                    <option>Female</option>
                                                    <option>Other</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Disease / Specialty</label>
                                            <select name="disease" value={formData.disease} onChange={handleDiseaseChange} className="w-full border p-2.5 rounded-lg outline-none text-sm font-medium text-indigo-700 bg-indigo-50/50">
                                                <option value="Kale Kadha">Kale Kadha (Aurvedic / Herbal Medicine)</option>
                                                <option value="Orthopedics">Orthopedics (Dr. Bunny)</option>
                                                <option value="Cardiology">Cardiology (Heart Problem)</option>
                                                <option value="Neurology">Neurology (Brain/Nerve Problem)</option>
                                                <option value="General Medicine">General Medicine (Fever/General)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Assigned Specialist Doctor</label>
                                            <input type="text" readOnly value={formData.doctor} className="w-full border p-2.5 rounded-lg text-sm bg-emerald-50 text-emerald-800 font-bold cursor-not-allowed" />
                                            <p className="text-[11px] text-slate-400 mt-1">* Doctor is auto-matched based on selected disease department.</p>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Phone Number</label>
                                            <input type="tel" name="phone" required value={formData.phone} onChange={handleInputChange} className="w-full border p-2.5 rounded-lg outline-none text-sm" placeholder="9876543210" />
                                        </div>
                                        <button type="submit" className="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition text-sm shadow">
                                            Register Patient & Fix Appointment
                                        </button>
                                    </form>
                                </div>

                                <div className="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h3 className="font-semibold text-slate-800 mb-4 pb-2 border-b">Admitted Patients Records</h3>
                                    {patients.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400">
                                            <i className="fa-solid fa-user-plus text-4xl mb-2"></i>
                                            <p>No patients added yet. Fill the form to register a patient!</p>
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-sm">
                                                <thead>
                                                    <tr className="bg-slate-50 text-slate-500 uppercase text-xs">
                                                        <th className="p-3">ID</th>
                                                        <th className="p-3">Name</th>
                                                        <th className="p-3">Age/Gender</th>
                                                        <th className="p-3">Disease</th>
                                                        <th className="p-3">Doctor</th>
                                                        <th className="p-3">Phone</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {patients.map(p => (
                                                        <tr key={p.id}>
                                                            <td className="p-3 font-semibold">#{p.id}</td>
                                                            <td className="p-3 text-slate-900 font-medium">{p.name}</td>
                                                            <td className="p-3 text-slate-600">{p.age} yrs / {p.gender}</td>
                                                            <td className="p-3"><span className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full text-xs font-semibold">{p.disease}</span></td>
                                                            <td className="p-3 text-indigo-700 font-bold">{p.doctor}</td>
                                                            <td className="p-3 text-slate-600">{p.phone}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: DOCTOR MODULE */}
                        {activeTab === 'doctors' && (
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                <h3 className="font-semibold text-slate-800 mb-4 pb-2 border-b">Doctor Profiles & Department Mapping</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {doctors.map(doc => (
                                        <div key={doc.id} className="border border-slate-200 p-5 rounded-xl bg-slate-50/50 space-y-3">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold text-slate-800">{doc.name}</h4>
                                                    <span className="text-xs text-indigo-600 font-semibold">{doc.dept}</span>
                                                </div>
                                                <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full text-xs font-semibold">{doc.status}</span>
                                            </div>
                                            <div className="text-xs text-slate-600 space-y-1">
                                                <p><i className="fa-regular fa-clock mr-1 text-slate-400"></i> Timing: {doc.timing}</p>
                                                <p><i className="fa-solid fa-money-bill-wave mr-1 text-slate-400"></i> Fee: {doc.fee}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: APPOINTMENT MODULE */}
                        {activeTab === 'appointments' && (
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                <h3 className="font-semibold text-slate-800 mb-4 pb-2 border-b">Appointment Management & Live Status</h3>
                                {appointments.length === 0 ? (
                                    <div className="text-center py-16 text-slate-400">
                                        <i className="fa-solid fa-calendar-xmark text-5xl mb-3"></i>
                                        <p className="text-base font-medium">No appointments fixed yet!</p>
                                        <p className="text-xs text-slate-400 mt-1">Go to "Patient Module", select disease department & register a patient to fix an appointment instantly.</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse text-sm">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-500 uppercase text-xs">
                                                    <th className="p-3">Booking ID</th>
                                                    <th className="p-3">Patient Name</th>
                                                    <th className="p-3">Disease Dept</th>
                                                    <th className="p-3">Consulting Doctor</th>
                                                    <th className="p-3">Date</th>
                                                    <th className="p-3">Time Slot</th>
                                                    <th className="p-3">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {appointments.map(app => (
                                                    <tr key={app.id}>
                                                        <td className="p-3 font-semibold text-indigo-600">#{app.id}</td>
                                                        <td className="p-3 font-medium text-slate-800">{app.patient}</td>
                                                        <td className="p-3 text-slate-600"><span className="bg-slate-100 px-2 py-0.5 rounded text-xs">{app.disease}</span></td>
                                                        <td className="p-3 text-indigo-700 font-bold">{app.doctor}</td>
                                                        <td className="p-3 text-slate-600">{app.date}</td>
                                                        <td className="p-3 text-slate-600">{app.time}</td>
                                                        <td className="p-3">
                                                            <span className="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">
                                                                {app.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 5: DEPARTMENT MODULE */}
                        {activeTab === 'departments' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {[
                                    { title: "Kale Kadha", head: "Dr. Kale Kadha", beds: "15/15 Available", icon: "fa-leaf" },
                                    { title: "Orthopedics", head: "Dr. Bunny", beds: "8/10 Available", icon: "fa-bone" },
                                    { title: "Cardiology", head: "Dr. A. Sharma", beds: "12/15 Available", icon: "fa-heart-pulse" },
                                    { title: "Neurology", head: "Dr. C. Verma", beds: "5/8 Available", icon: "fa-brain" },
                                    { title: "General Medicine", head: "Dr. D. Gupta", beds: "20/25 Available", icon: "fa-stethoscope" }
                                ].map((d, i) => (
                                    <div key={i} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                        <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                                            <i className={`fa-solid ${d.icon}`}></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-800">{d.title} Department</h4>
                                            <p className="text-xs text-slate-500">Head: <span className="font-bold text-indigo-600">{d.head}</span></p>
                                            <p className="text-xs text-emerald-600 font-semibold mt-1">Bed Status: {d.beds}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
